<div style="padding: 20px; font-family: sans-serif">
  <h3>Transcrição Direta do Microfone (Whisper Tiny)</h3>

  <div style="margin-bottom: 15px">
    @if (!isRecording()) {
      <button
        (click)="startRecording()"
        style="background: green; color: white; padding: 10px 20px; border: none; cursor: pointer"
      >
        🎤 Iniciar Gravação
      </button>
    }

    @if (isRecording()) {
      <button
        (click)="stopRecording()"
        style="background: red; color: white; padding: 10px 20px; border: none; cursor: pointer"
      >
        🛑 Parar e Transcrever
      </button>
    }
  </div>

  <p><strong>Status:</strong> {{ status }}</p>

  @if (transcription) {
    <div
      style="margin-top: 15px; padding: 15px; background: #f4f4f4; border-left: 5px solid #007bff"
    >
      <strong>Texto Transcrito:</strong>
      <p style="margin: 5px 0 0 0; font-size: 1.1em">{{ transcription }}</p>
    </div>
  }
</div>
